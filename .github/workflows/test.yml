name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run guardrail tests
        env:
          # Required for tests/test_alignment_guardrails.py's DB-backed checks
          # (validate-650 stability, etc.) — without it those tests skip
          # rather than fail, so add this secret once the repo has one to
          # test against. Never a production write: every DB-touching test
          # here is read-only.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pytest tests/ -v
