services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: curriculumlens
      POSTGRES_USER: curriculumlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_set_a_real_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculumlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://curriculumlens:${POSTGRES_PASSWORD:-changeme_set_a_real_password}@db:5432/curriculumlens
      PORT: 8501
    ports:
      - "8501:8501"

volumes:
  pgdata:
